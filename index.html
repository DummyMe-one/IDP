<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevPortal — Internal Developer Portal</title>
    <meta name="description" content="Secure internal developer portal for managing projects, environments, secrets, and team collaboration." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
      html.dark, html.dark body { background-color: #111315; color: #fcfcfc; }
      html.light, html.light body { background-color: #F4F4F2; color: #1A1D1F; }
      #root { min-height: 100vh; }
    </style>
    <script>
      (function() {
        var theme = localStorage.getItem('theme');
        if (theme !== 'dark' && theme !== 'light') {
          theme = 'light';
        }
        document.documentElement.classList.add(theme);
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
